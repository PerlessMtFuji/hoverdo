[package]
name = "hoverdo"
version = "0.0.1"
description = "Floating-widget-first notes and todos for Windows"
edition = "2024"
rust-version = "1.85"

[lib]
name = "hoverdo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }

# SQLite layer - feature-gated to keep cold builds tight until repos land
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time", "uuid"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"

[features]
default = []
# Enable once db/ module is wired in commit 2
db = ["dep:sqlx"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
